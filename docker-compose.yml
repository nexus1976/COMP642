version: "3.9"

services:
  local-mongodb:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: local-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dbuser
      - MONGO_INITDB_ROOT_PASSWORD=password1234
    volumes:
      - mongo_data:/data/db

  local-redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  local-postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: local-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=password1234
      - POSTGRES_DB=group4db
    volumes:
      - postgres_data:/var/lib/postgresql

  comp642-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: comp642-api
    ports:
      - "8890:8890"
    depends_on:
      - local-mongodb
      - local-redis
      - local-postgres

  comp642-web:
    image: comp642-web
    container_name: comp642-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
volumes:
  mongo_data:
  redis_data:
  postgres_data:
