version: "3.9"

services:
  local-mongodb:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: local-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dbuser
      - MONGO_INITDB_ROOT_PASSWORD=password1234
      - MONGO_INITDB_DATABASE=group4db
    volumes:
      - mongo_data:/data/db
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  local-redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  local-postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: local-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=password1234
      - POSTGRES_DB=group4db
    volumes:
      - comp642-gp-db-data:/var/lib/postgresql/comp642-gp-db-data

  comp642-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: comp642-api
    ports:
      - "8890:8890"
    depends_on:
      - local-mongodb
      - local-redis
      - local-postgres
    environment:
      - DB_HOST=local-postgres
      - DB_UID=dbuser
      - DB_NAME=group4db
      - DB_PWD=password1234
      - MONGO_HOST=local-mongodb
      - MONGO_USERNAME=dbuser
      - MONGO_PASSWORD=password1234
      - REDIS_HOST=local-redis

  comp642-web:
    image: comp642-web
    container_name: comp642-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
volumes:
  mongo_data:
  redis_data:
  comp642-gp-db-data:
